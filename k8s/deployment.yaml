apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agency-backend
  labels:
    app: ai-agency
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-agency
      tier: backend
  template:
    metadata:
      labels:
        app: ai-agency
        tier: backend
    spec:
      containers:
      - name: backend
        image: ai-agency-os/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "sqlite:///./data/ai_agency.db"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-agency-secrets
              key: openai-api-key
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-agency-secrets
              key: secret-key
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ai-agency-data

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agency-backend
spec:
  selector:
    app: ai-agency
    tier: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agency-frontend
  labels:
    app: ai-agency
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agency
      tier: frontend
  template:
    metadata:
      labels:
        app: ai-agency
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: ai-agency-os/frontend:latest
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_URL
          value: "http://ai-agency-backend:8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: ai-agency-frontend
spec:
  selector:
    app: ai-agency
    tier: frontend
  ports:
  - port: 80
    targetPort: 5173
  type: LoadBalancer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-agency-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# Task A2: Security fix - Secrets should be created via kubectl create secret, not hardcoded
# Use: kubectl create secret generic ai-agency-secrets --from-literal=openai-api-key=sk-... --from-literal=secret-key=$(openssl rand -hex 32) --from-literal=postgres-password=$(openssl rand -base64 12) --from-literal=jwt-secret=$(openssl rand -hex 32)
# For prod, don't commit real secrets - this file is example only with placeholders that must be replaced
# Task A13: HPA now in separate hpa.yaml file
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-agency-secrets
  labels:
    app: ai-agency
type: Opaque
# SECURITY: In production, create secrets via kubectl, not via stringData in git
# Example: kubectl create secret generic ai-agency-secrets --from-literal=openai-api-key=sk-real-... --from-literal=secret-key=$(openssl rand -hex 32)
# For this example file, we use placeholders that MUST be replaced - Task A2 fix
stringData:
  openai-api-key: "sk-PLACEHOLDER-MUST-REPLACE-via-kubectl-create-secret"
  secret-key: "PLACEHOLDER-MUST-REPLACE-via-openssl-rand-hex-32"
  postgres-password: "PLACEHOLDER-MUST-REPLACE"
  jwt-secret: "PLACEHOLDER-MUST-REPLACE-via-openssl-rand-hex-32"
  grafana-password: "PLACEHOLDER-MUST-REPLACE"
