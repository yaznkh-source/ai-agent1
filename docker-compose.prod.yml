# Production Docker Compose - AI Agency OS v25 Beta Ready 70/100
# Full stack with Postgres, Redis, ChromaDB, S3 mock, monitoring
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Task A2: Security fix - require secrets, no weak defaults
# Task A12: Config test

services:
  # Backend - 3 replicas via deploy, but compose runs 1, K8s runs 3
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage
    env_file:
      - .env.prod
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # Task A2: Require secrets - fail if not set
      - DATABASE_URL=postgresql://aiagency:${POSTGRES_PASSWORD:?Must set POSTGRES_PASSWORD in .env.prod - see .env.prod.example}@postgres:5432/aiagency
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Must set REDIS_PASSWORD}@redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - STORAGE_PROVIDER=s3
      - S3_BUCKET=ai-agency-prod
      - S3_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - EMAIL_PROVIDER=sendgrid
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=noreply@ai-agency.os
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET:?Must set JWT_SECRET in .env.prod - generate via openssl rand -hex 32}
      - ENV=production
      - ALLOW_DEMO_ACCOUNTS=false
      - CORS_ORIGINS=https://ai-agency.os,https://api.ai-agency.os,https://docs.ai-agency.os
    depends_on:
      - postgres
      - redis
      - chroma
    networks:
      - ai-agency
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.ai-agency.os
        - VITE_BRAND_NAME=AI Agency OS
        - VITE_BRAND_PRIMARY_COLOR=#8b5cf6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - ai-agency
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=aiagency
      - POSTGRES_USER=aiagency
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Must set POSTGRES_PASSWORD}
    networks:
      - ai-agency
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiagency"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-agency
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Must set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - ai-agency
    restart: unless-stopped

  # MinIO - S3 compatible local storage for dev/prod without AWS
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?Must set MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Must set MINIO_ROOT_PASSWORD - min 8 chars}
    command: server /data --console-address ":9001"
    networks:
      - ai-agency
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Ollama - local LLM
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-agency
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Remove GPU section if no GPU

  # Monitoring - Prometheus + Grafana (optional)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ai-agency
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Must set GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - ai-agency
    restart: unless-stopped
    profiles:
      - monitoring

  # Certbot for SSL (Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@ai-agency.os --agree-tos --no-eff-email -d ai-agency.os -d www.ai-agency.os -d api.ai-agency.os
    profiles:
      - ssl

volumes:
  backend_data:
  backend_storage:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  certbot_certs:
  certbot_www:

networks:
  ai-agency:
    driver: bridge
